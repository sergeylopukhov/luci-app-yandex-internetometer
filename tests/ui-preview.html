<script>
String.prototype.format=function(...args){let i=0;return this.replace(/%[sd]/g,()=>args[i++])};
function E(tag,attrs,children){const e=document.createElement(tag);for(const [k,v]of Object.entries(attrs||{})){if(typeof v==='function')e.addEventListener(k,v);else if(v!==null&&v!==undefined)e.setAttribute(k,v)}function add(c){if(c==null)return;if(Array.isArray(c))c.forEach(add);else e.append(c instanceof Node?c:document.createTextNode(String(c)))}add(children);return e}

function state(){let d={...base};if(!start)return d;let t=(Date.now()-start)/1000;d.started_at=new Date(start).toISOString();d.timestamp=new Date().toISOString();d.running=!cancelled&&t<13;d.phase=cancelled?'cancelled':t<1?'prepare':t<3?'ping':t<8?'download':t<13?'upload':'complete';d.ping_ms=t>3?12.5:null;d.download_mbps=t>3?350:null;d.upload_mbps=t>8?180:null;d.current_mbps=d.phase==='upload'?182:354;d.phase_duration=5;d.phase_started=start/1000+(t<8?3:8);d.quality=cancelled?'cancelled':t>=13?'complete':'unknown';return d}
const fs={exec_direct:(path)=>{if(offline)return Promise.reject(Error('timeout'));let cmd=path.split('/').pop();if(cmd==='start'){start=Date.now();cancelled=false}if(cmd==='stop')cancelled=true;if(cmd==='history')return Promise.resolve({records:[]});if(cmd==='update-check')return Promise.resolve({ok:true,update_available:false});return Promise.resolve(state())}};
const controls=[];

fetch('../htdocs/luci-static/resources/view/status/yandex-internetometer-live.js').then(r=>r.text()).then(async source=>{const app=new Function('view','fs','form','uci','poll','E',source.replaceAll('/luci-static/','/htdocs/luci-static/'))({extend:o=>o},fs,form,{load:()=>Promise.resolve()},{add:f=>{pollFn=f;setInterval(f,1000)}},E);document.querySelector('main').append(await app.render(await app.load()))});
