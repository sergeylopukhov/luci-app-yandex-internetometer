<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internetometer UI verification</title>
<style>body{margin:0;background:#f4f4f4;font-family:system-ui}main{max-width:1060px;margin:auto;padding:20px}button,input,select{font:inherit}h2{font-size:24px}.table{border-collapse:collapse}.table td,.table th{padding:8px;text-align:left}.alert-message{padding:16px;background:#fff3df}.preview-label{padding:8px 20px;background:#fff3df;font-size:13px}</style>
<div class="preview-label">Локальный стенд интерфейса · демонстрационные значения · роутер не нагружается</div><main id="app"></main>
<script>
String.prototype.format=function(...args){let i=0;return this.replace(/%[sd]/g,()=>args[i++])};
function E(tag,attrs,children){const e=document.createElement(tag);for(const [k,v]of Object.entries(attrs||{})){if(typeof v==='function')e.addEventListener(k,v);else if(v!==null&&v!==undefined)e.setAttribute(k,v)}function add(c){if(c==null)return;if(Array.isArray(c))c.forEach(add);else e.append(c instanceof Node?c:document.createTextNode(String(c)))}add(children);return e}
// Query: ?update=1 (update notice with the real long command), history=1 (demo history), theme=light|dark, lang=ru|en.
const q=new URLSearchParams(location.search);
try{if(q.get('theme'))localStorage.setItem('yandexInternetometerTheme',q.get('theme'));if(q.get('lang'))localStorage.setItem('yandexInternetometerLanguage',q.get('lang'))}catch(e){}
const demoHistory=q.get('history')?Array.from({length:24},(_,i)=>({id:String(i),timestamp:new Date(Date.now()-(23-i)*86400000*1.2).toISOString(),download_mbps:Math.round(720+90*Math.sin(i/2.3)+(i%5)*9),upload_mbps:i%9===4?null:Math.round(880+45*Math.cos(i/1.7)),ping_ms:1.4+(i%4)*.3,...(i>15?{download_peak_mbps:Math.round(790+60*Math.sin(i)),upload_peak_mbps:i%9===4?null:Math.round(945+20*Math.cos(i))}:{})})):[];
const updateInfo=q.get('update')?{ok:true,update_available:true,installed_version:'1.1.2-r1',release:{version:'2.0.0',release_url:'https://github.com/sergeylopukhov/luci-app-yandex-internetometer/releases/tag/v2.0.0'}}:{ok:true,update_available:false};
let start=0,cancelled=false,offline=false,pollFn,final=false;
const base={ok:true,running:false,phase:'ready',streams:4,upload_streams:2,download_time:4,upload_time:4,upload_enabled:1,latency_samples:30,transfer_protocol:'http',version:'local',public_ip:'192.0.2.1',cpu_peak:0,mem_available_min_kb:150000};
if(q.get('result'))Object.assign(base,{phase:'complete',quality:'complete',timestamp:new Date().toISOString(),download_mbps:823.04,upload_mbps:921.38,download_peak_mbps:861.2,upload_peak_mbps:944.07,ping_ms:1.47,jitter_ms:0.2});
function state(){let d={...base};if(!start)return d;let t=(Date.now()-start)/1000;d.started_at=new Date(start).toISOString();d.timestamp=new Date().toISOString();d.running=!cancelled&&t<14;d.phase=cancelled?'cancelled':t<1?'prepare':t<6.5?'download':t<12?'upload':t<14?'ping':'complete';
// Download 1-6 s, 0.5 s pause, upload 6.5-11.5 s, 0.5 s pause, ping 12-14 s; each speed phase has no sample during its first second.
const ramp=(from,top)=>t-from<1?null:Math.round(top*Math.min(1,(t-from)/2.5)*(0.97+0.06*Math.random())*100)/100;
d.download_mbps=t>2?(t<6?350:347.25):null;d.upload_mbps=t>7.5?(t<11.5?180:181.6):null;d.ping_ms=t>13?12.5:null;
d.current_mbps=(t>=6&&t<6.5)||t>=11.5?null:d.phase==='upload'?ramp(6.5,182):d.phase==='download'?ramp(1,354):null;
d.download_peak_mbps=d.download_mbps&&361.4;d.upload_peak_mbps=d.upload_mbps&&188.9;
d.phase_duration=5;d.phase_started=start/1000+(t<6.5?1:t<12?6.5:12);d.quality=cancelled?'cancelled':t>=14?'complete':'unknown';return d}
const fs={exec_direct:(path)=>{if(offline)return Promise.reject(Error('timeout'));let cmd=path.split('/').pop();if(cmd==='start'){start=Date.now();cancelled=false}if(cmd==='stop')cancelled=true;if(cmd==='history')return Promise.resolve({records:demoHistory});if(cmd==='update-check')return Promise.resolve(updateInfo);return Promise.resolve(state())}};
const controls=[];
const form={Value:1,ListValue:2,Flag:3,NamedSection:4,Map:function(){this.section=()=>({option:(kind,key,label)=>{let o={kind,key,label,values:[],value(k,v){this.values.push([k,v])}};controls.push(o);return o}});this.render=()=>Promise.resolve(E('div',{class:'cbi-map'},controls.map(o=>{let field=o.kind===2?E('select',{},o.values.map(([k,v])=>E('option',{value:k,selected:k===o.default?'':null},v))):E('input',{type:o.kind===3?'checkbox':'text',value:o.default||''});let id='preview-'+o.key;field.id=id;if(o.kind===3&&o.default==='1')field.checked=true;if(o.onchange)field.addEventListener('change',ev=>o.onchange(ev,'main',o.kind===3?(field.checked?'1':'0'):field.value));return E('div',{class:'cbi-value'},[E('label',{class:'cbi-value-title',for:id},o.label),E('div',{class:'cbi-value-field'},field),E('div',{class:'cbi-value-description'},o.description)])})))}};
fetch('../htdocs/luci-static/resources/view/status/yandex-internetometer-live.js',{cache:'no-store'}).then(r=>r.text()).then(async source=>{const app=new Function('view','fs','form','uci','poll','E',source.replaceAll('/luci-static/','/htdocs/luci-static/'))({extend:o=>o},fs,form,{load:()=>Promise.resolve()},{add:f=>{pollFn=f;setInterval(f,1000)}},E);document.querySelector('main').append(await app.render(await app.load()))});
</script></html>
