name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish
        required: true
        default: v2.0.0

permissions:
  contents: write

env:
  PKG_NAME: luci-app-yandex-internetometer
  PROJECT_VERSION: 2.0.0
  PKG_VERSION: 2.0.0-r1

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget zstd openssl xz-utils

      # The native engine is cross-compiled with zig into static binaries, one per ISA family.
      - name: Install zig
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          set -eu
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "$RUNNER_TEMP/zig.tar.xz" "$ZIG_URL"
          printf '%s  %s\n' "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          set -eu
          tests/test-history.sh
          tests/test-release-metadata.sh
          node tests/test-history-ui.js
          node tests/test-status-ui.js
          node tests/test-animation-ui.js
          sh tests/test-state.sh
          sh tests/test-migration.sh
          cc -std=c99 -Wall -Wextra -Werror -O2 src/transfer.c -o /tmp/yi-transfer-native
          python3 tests/test-transfer.py /tmp/yi-transfer-native
          python3 tests/test-transfer-shell.py root/usr/libexec/yandex-internetometer/transfer

      - name: Build native engine for every architecture
        run: |
          set -eu
          zig version
          sh scripts/build-native.sh "$RUNNER_TEMP/native"

      - name: Verify architecture-specific packages
        run: |
          set -eu
          python3 tests/test-packages.py "$RUNNER_TEMP/native" $(sh scripts/build-native.sh --list)

      - name: Prepare package root
        run: |
          set -eu
          sh scripts/stage-root.sh "$RUNNER_TEMP/pkgroot"
          find "$RUNNER_TEMP/pkgroot" -type f -print

      - name: Build ipk assets
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for arch in $(sh scripts/build-native.sh --list); do
            sh scripts/build-ipk.sh "$RUNNER_TEMP/pkgroot" "$RUNNER_TEMP/native" "$arch" "$PKG_VERSION" \
              "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-${PROJECT_VERSION}-openwrt-24.10-$arch.ipk"
          done

      - name: Download apk-capable OpenWrt SDK
        run: |
          set -eu
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          SUMS_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/sha256sums"
          SDK_FILE="openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fsSL --retry 5 --connect-timeout 30 -o "$RUNNER_TEMP/sha256sums" "$SUMS_URL"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
            -o "$RUNNER_TEMP/sdk.tar.zst" "$SDK_URL"
          EXPECTED="$(awk -v file="*$SDK_FILE" '$2 == file { print $1; exit }' "$RUNNER_TEMP/sha256sums")"
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/sdk.tar.zst" | sha256sum -c -
          tar -I zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk" --strip-components=1

      - name: Build apk assets
        env:
          APK_PRIVATE_KEY: ${{ secrets.YANDEX_INTERNETOMETER_APK_PRIVATE_KEY }}
        run: |
          set -eu
          SDK="$RUNNER_TEMP/sdk"
          PKGROOT="$RUNNER_TEMP/pkgroot"
          test -x "$SDK/staging_dir/host/bin/apk"
          test -n "${APK_PRIVATE_KEY:-}" || { echo 'YANDEX_INTERNETOMETER_APK_PRIVATE_KEY is required' >&2; exit 1; }
          printf '%s\n' "$APK_PRIVATE_KEY" > "$SDK/private-key.pem"
          openssl ec -in "$SDK/private-key.pem" -pubout -out "$GITHUB_WORKSPACE/dist/yandex-internetometer.rsa.pub"
          ARCHES="$(sh scripts/build-native.sh --list)"
          for arch in $ARCHES; do
            # Each architecture gets its own root: the shared files plus its native engine.
            ARCHROOT="$RUNNER_TEMP/apkroot-$arch"
            mkdir -p "$ARCHROOT"
            cp -a "$PKGROOT/." "$ARCHROOT/"
            if [ -f "$RUNNER_TEMP/native/$arch/transfer-native" ]; then
              install -m 0755 "$RUNNER_TEMP/native/$arch/transfer-native" "$ARCHROOT/usr/libexec/yandex-internetometer/transfer-native"
            fi
            "$SDK/staging_dir/host/bin/apk" mkpkg \
              --info "name:$PKG_NAME" \
              --info "version:$PKG_VERSION" \
              --info "arch:$arch" \
              --info "license:MIT" \
              --info "origin:$PKG_NAME" \
              --info "url:https://github.com/sergeylopukhov/luci-app-yandex-internetometer" \
              --info "maintainer:Sergey Lopukhov <sergey.lopukhov@gmail.com>" \
              --info "description:LuCI app for unofficial Yandex Internetometer-compatible speed tests" \
              --info "depends:libc curl jq" \
              --script "post-install:$GITHUB_WORKSPACE/scripts/post-install" \
              --script "post-upgrade:$GITHUB_WORKSPACE/scripts/post-install" \
              --script "post-deinstall:$GITHUB_WORKSPACE/scripts/post-deinstall" \
              --files "$ARCHROOT" \
              --output "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-${PROJECT_VERSION}-openwrt-snapshot-$arch.apk"
          done

          REPO="$GITHUB_WORKSPACE/docs/packages"
          mv "$REPO" "$RUNNER_TEMP/previous-packages"
          mv "$GITHUB_WORKSPACE/docs/keys" "$RUNNER_TEMP/previous-keys"
          mkdir -p "$REPO" "$GITHUB_WORKSPACE/docs/keys"
          cp "$GITHUB_WORKSPACE/dist/yandex-internetometer.rsa.pub" "$GITHUB_WORKSPACE/docs/keys/yandex-internetometer.rsa.pub"
          for arch in $ARCHES; do
            dir="$REPO/$arch/yandex-internetometer"
            mkdir -p "$dir"
            cp "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-${PROJECT_VERSION}-openwrt-snapshot-$arch.apk" "$dir/luci-app-yandex-internetometer-$PKG_VERSION.apk"
            (
              cd "$dir"
              "$SDK/staging_dir/host/bin/apk" mkndx \
                --root "$GITHUB_WORKSPACE" \
                --keys-dir "$GITHUB_WORKSPACE" \
                --allow-untrusted \
                --sign "$SDK/private-key.pem" \
                --output packages.adb \
                *.apk
            )
          done

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Pack signed APK repository for GitHub Pages
        run: |
          tar -C "$GITHUB_WORKSPACE/docs" -czf "$RUNNER_TEMP/yandex-internetometer-apk-repository.tar.gz" packages keys

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*

      - name: Upload signed APK repository
        uses: actions/upload-artifact@v4
        with:
          name: pages-apk-repository
          path: ${{ runner.temp }}/yandex-internetometer-apk-repository.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid release tag: $TAG" >&2; exit 1;; esac
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "Unsafe release tag: $TAG" >&2; exit 1;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
          awk -v version="$PROJECT_VERSION" '
            $0 == "## Версия " version { current=1; next }
            current && /^## Версия / { exit }
            current { print }
          ' RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" dist/* \
              --title "Яндекс Интернетометр ${PROJECT_VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

  publish-pages:
    name: Publish verified APK repository and metadata
    needs: release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: pages-apk-repository
          path: ${{ runner.temp }}/pages-apk-repository
      - name: Update GitHub Pages files after release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid release tag: $TAG" >&2; exit 1;; esac
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "Unsafe release tag: $TAG" >&2; exit 1;; esac
          git config user.name "Sergey Lopukhov"
          git config user.email "sergey.lopukhov@gmail.com"
          mv docs/packages "$RUNNER_TEMP/previous-packages"
          mv docs/keys "$RUNNER_TEMP/previous-keys"
          tar -C docs -xzf "$RUNNER_TEMP/pages-apk-repository/yandex-internetometer-apk-repository.tar.gz"
          cat > docs/version.json <<EOF
          {
            "version": "${PROJECT_VERSION}",
            "package_version": "${PKG_VERSION}",
            "tag": "${TAG}",
            "release_url": "https://github.com/sergeylopukhov/luci-app-yandex-internetometer/releases/tag/${TAG}",
            "install_url": "https://sergeylopukhov.github.io/luci-app-yandex-internetometer/install.sh",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git add docs/keys docs/packages docs/install.sh docs/version.json
          git diff --cached --quiet || {
            git commit -m "Publish ${TAG} package repository"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              sleep "$attempt"
            done
            exit 1
          }
