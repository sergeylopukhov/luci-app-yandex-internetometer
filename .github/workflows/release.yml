name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_NAME: luci-app-yandex-internetometer
  PKG_VERSION: 0.0.1-r1

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zstd openssl

      - name: Prepare package root
        run: |
          set -eu
          PKGROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$PKGROOT"
          cp -a root/. "$PKGROOT"/
          mkdir -p "$PKGROOT/www"
          cp -a htdocs/. "$PKGROOT/www"/
          find "$PKGROOT" -type d -print
          find "$PKGROOT" -type f -print

      - name: Build ipk asset
        run: |
          set -eu
          WORK="$RUNNER_TEMP/ipk"
          PKGROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$WORK/control" "$GITHUB_WORKSPACE/dist"
          cat > "$WORK/control/control" <<EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Depends: curl, jq
          Source: https://github.com/sergeylopukhov/luci-app-yandex-internetometer
          SourceName: $PKG_NAME
          License: MIT
          Section: luci
          URL: https://github.com/sergeylopukhov/luci-app-yandex-internetometer
          Maintainer: Sergey Lopukhov
          Architecture: all
          Description:  LuCI app for unofficial Yandex Internetometer-compatible speed tests
          EOF
          cat > "$WORK/control/conffiles" <<EOF
          /etc/config/yandex-internetometer
          EOF
          printf '2.0\n' > "$WORK/debian-binary"
          tar --numeric-owner --owner=0 --group=0 -czf "$WORK/data.tar.gz" -C "$PKGROOT" .
          tar --numeric-owner --owner=0 --group=0 -czf "$WORK/control.tar.gz" -C "$WORK/control" .
          tar --numeric-owner --owner=0 --group=0 -czf \
            "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-0.0.1-openwrt-24.10-all.ipk" \
            -C "$WORK" ./debian-binary ./data.tar.gz ./control.tar.gz

      - name: Download apk-capable OpenWrt SDK
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sdk"
          wget -O "$RUNNER_TEMP/sdk.tar.zst" \
            https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$RUNNER_TEMP/sdk" --strip-components=1

      - name: Build apk assets
        run: |
          set -eu
          SDK="$RUNNER_TEMP/sdk"
          PKGROOT="$RUNNER_TEMP/pkgroot"
          test -x "$SDK/staging_dir/host/bin/apk"
          if [ ! -f "$SDK/private-key.pem" ]; then
            openssl genrsa -out "$SDK/private-key.pem" 2048
          fi
          openssl rsa -in "$SDK/private-key.pem" -pubout -out "$GITHUB_WORKSPACE/dist/yandex-internetometer.rsa.pub"
          ARCHES="
          aarch64
          aarch64_cortex-a53
          aarch64_cortex-a72
          aarch64_cortex-a76
          aarch64_generic
          armhf
          armv7
          arm_arm1176jzf-s_vfp
          arm_arm926ej-s
          arm_cortex-a15_neon-vfpv4
          arm_cortex-a5_vfpv4
          arm_cortex-a7
          arm_cortex-a7_neon-vfpv4
          arm_cortex-a7_vfpv4
          arm_cortex-a8_vfpv3
          arm_cortex-a9
          arm_cortex-a9_neon
          arm_cortex-a9_vfpv3-d16
          arm_fa526
          arm_xscale
          armeb_xscale
          x86
          i386_pentium-mmx
          i386_pentium4
          mips
          mipsel
          mips64
          mips64el
          mips64_mips64r2
          mips64_octeonplus
          mips64el_mips64r2
          mips_24kc
          mips_4kec
          mips_mips32
          mipsel_24kc
          mipsel_24kc_24kf
          mipsel_74kc
          mipsel_mips32
          powerpc64_e5500
          powerpc_464fp
          powerpc_8548
          ppc64le
          riscv64
          riscv64_generic
          riscv64_riscv64
          x86_64
          "
          for arch in $ARCHES; do
            "$SDK/staging_dir/host/bin/apk" mkpkg \
              --info "name:$PKG_NAME" \
              --info "version:$PKG_VERSION" \
              --info "arch:noarch" \
              --info "license:MIT" \
              --info "origin:$PKG_NAME" \
              --info "url:https://github.com/sergeylopukhov/luci-app-yandex-internetometer" \
              --info "maintainer:Sergey Lopukhov" \
              --info "description:LuCI app for unofficial Yandex Internetometer-compatible speed tests" \
              --info "depends:libc curl jq" \
              --files "$PKGROOT" \
              --sign "$SDK/private-key.pem" \
              --output "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-0.0.1-openwrt-snapshot-$arch.apk"
          done

          REPO="$GITHUB_WORKSPACE/docs/packages"
          mkdir -p "$REPO" "$GITHUB_WORKSPACE/docs/keys"
          cp "$GITHUB_WORKSPACE/dist/yandex-internetometer.rsa.pub" "$GITHUB_WORKSPACE/docs/keys/yandex-internetometer.rsa.pub"
          for arch in $ARCHES; do
            dir="$REPO/$arch/yandex-internetometer"
            mkdir -p "$dir"
            cp "$GITHUB_WORKSPACE/dist/luci-app-yandex-internetometer-0.0.1-openwrt-snapshot-$arch.apk" "$dir/luci-app-yandex-internetometer-0.0.1-r1.apk"
            (
              cd "$dir"
              "$SDK/staging_dir/host/bin/apk" mkndx \
                --root "$GITHUB_WORKSPACE" \
                --keys-dir "$GITHUB_WORKSPACE" \
                --allow-untrusted \
                --sign "$SDK/private-key.pem" \
                --output packages.adb \
                *.apk
            )
          done

      - name: Commit GitHub Pages APK repository
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/keys docs/packages
          if ! git diff --cached --quiet; then
            git commit -m "Update generated APK repository"
            git push origin main
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
          gh release create "$GITHUB_REF_NAME" dist/* \
              --title "luci-app-yandex-internetometer $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
